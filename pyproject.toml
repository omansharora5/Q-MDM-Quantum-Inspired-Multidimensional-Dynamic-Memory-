[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemograph"
version = "0.3.0"
description = "Shared, evidence-backed memory for independent agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=1.12,<2", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.10,<4"]
falkordb = ["falkordb>=1.2,<2"]

[project.scripts]
mnemograph = "mnemograph.cli:main"

[tool.vercel]
entrypoint = "api.index:app"

[tool.setuptools.packages.find]
include = ["mnemograph*"]

[tool.setuptools.package-data]
mnemograph = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
